<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{height:100%;margin:0;background:#04021a}
*{box-sizing:border-box}
svg.defs{position:absolute;width:0;height:0}

/* ===== Welcome splash (logo only) ===== */
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 100%,#8a0050 0%,#3a0030 35%,transparent 65%),radial-gradient(90% 70% at 0% 0%,#0a0a5a 0%,transparent 60%),#04021a;
  transition:opacity .5s ease .35s}
#splash.out{opacity:0;pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%}
#splash .stage{perspective:1200px;width:min(66vw,320px);aspect-ratio:1.02;position:relative;transition:transform 1s cubic-bezier(.7,0,.9,.4)}
#splash.out .stage{transform:scale(22)}
.scene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.logo{position:absolute;inset:0;transform-style:preserve-3d}
.logo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.depth{transition:transform 1.4s cubic-bezier(.2,.9,.2,1);transform:translateZ(0)}
.logo.exp .depth{transform:translateZ(var(--z))}
.front{opacity:0;transition:opacity .9s ease;filter:drop-shadow(0 0 30px rgba(150,60,255,.6))}
.logo.fill .front{opacity:1}
.draw use{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
.logo.fill .draw{opacity:0;transition:opacity .6s}
@keyframes draw{to{stroke-dashoffset:0}}
.sweep{opacity:0}
.logo.sw .sweep{animation:sweep 1.1s ease-in-out forwards}
@keyframes sweep{0%{opacity:1;transform:translateX(-260px) skewX(-20deg)}100%{opacity:1;transform:translateX(1000px) skewX(-20deg)}}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.shock{position:absolute;left:50%;top:50%;width:100%;aspect-ratio:1;margin:-50% 0 0 -50%;border-radius:50%;border:2px solid #b58cff;opacity:0;transform:translateZ(-20px) rotateX(70deg) scale(.2)}
.shock.go{animation:shock 1.5s ease-out forwards}
.shock.s2{border-color:#ff8aa8}.shock.s2.go{animation-delay:.18s}
@keyframes shock{0%{opacity:.9;transform:translateZ(-20px) rotateX(70deg) scale(.2)}100%{opacity:0;transform:translateZ(-20px) rotateX(70deg) scale(2.6)}}
.halo{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(closest-side,rgba(160,80,255,.55),rgba(255,100,120,.18) 55%,transparent);opacity:0;transform:translateZ(-60px);transition:opacity 1.2s}
.halo.on{opacity:1}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs>
<linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="213" x2="0" y2="798"><stop offset="0" stop-color="#4cc4ff"/><stop offset=".3" stop-color="#7a5cff"/><stop offset=".5" stop-color="#8d1fff"/><stop offset="1" stop-color="#c010c0"/></linearGradient>
<linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="590" y1="600" x2="965" y2="720"><stop offset="0" stop-color="#6b1a7e"/><stop offset=".4" stop-color="#e0608e"/><stop offset=".65" stop-color="#ff6070"/><stop offset="1" stop-color="#ffa51f"/></linearGradient>
<linearGradient id="gs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<path id="body" pathLength="1" d="M400 665 L552 300 C575 245 630 213 690 213 C750 213 782 250 800 295 L856 440 C820 405 770 380 730 385 C670 392 630 430 640 478 C650 520 690 540 720 560 L640 690 C600 695 560 720 530 755 C500 790 450 805 415 785 C385 765 375 710 400 665 Z"/>
<path id="arm" pathLength="1" d="M640 470 C620 520 575 580 580 620 C585 660 630 685 690 688 C750 690 790 720 830 755 C860 790 905 805 940 780 C975 755 980 710 960 665 C940 620 900 560 850 535 C810 515 760 520 700 518 C660 515 640 500 640 470 Z"/>
<clipPath id="cp"><use href="#body"/><use href="#arm"/></clipPath>
</defs></svg>

<div id="splash" aria-label="Loading">
  <canvas id="fx"></canvas>
  <div class="stage"><div class="scene" id="scene">
    <div class="halo" id="halo"></div>
    <div class="shock" id="s1"></div><div class="shock s2" id="s2"></div>
    <div class="logo" id="logo"></div>
  </div></div>
</div>

<script>
/* ===== Config ===== */
const SPLASH_MS = 3600;      // when the exit (fly-through) starts
const REDIRECT_URL = 'https://abhishek777f.github.io/katha/';   // e.g. '/home' or 'https://yourapp.com' — leave null to just remove the splash
// Also fires:  window.addEventListener('welcome:done', () => { /* start your app */ })

/* ===== Logo layers (stacked for 3D depth) ===== */
const logo=document.getElementById('logo'),NS='http://www.w3.org/2000/svg';
const shape='<use href="#body" fill="url(#gB)"/><use href="#arm" fill="url(#gA)"/>';
const mk=(cls,inner,z,filter)=>{const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','375 205 610 600');
  s.setAttribute('class',cls);if(z!=null)s.style.setProperty('--z',z+'px');if(filter)s.style.filter=filter;s.innerHTML=inner;logo.appendChild(s)};
for(let i=20;i>=1;i--)mk('depth',shape,-i*2.8,'brightness('+Math.max(.12,.55-i*.03)+') saturate(1.2)');
mk('front',shape);
mk('sw','<g clip-path="url(#cp)"><rect class="sweep" x="300" y="150" width="150" height="700" fill="url(#gs)"/></g>');
mk('draw','<use href="#body" stroke="url(#gB)"/><use href="#arm" stroke="url(#gA)"/>');

/* ===== Particles + tilt ===== */
const cv=document.getElementById('fx'),g=cv.getContext('2d');let W,H,D=1,burst=0,running=true;
const fit=()=>{D=devicePixelRatio||1;W=cv.width=innerWidth*D;H=cv.height=innerHeight*D};fit();addEventListener('resize',fit);
const cols=['76,196,255','176,110,255','255,120,150','255,170,60'];
const P=Array.from({length:90},(_,i)=>({x:Math.random(),y:Math.random(),z:Math.random()*.9+.1,s:Math.random()*.0006+.0002,c:cols[i%4],a:Math.random()*6.28}));
const scene=document.getElementById('scene');let cx=0,cy=0,tx=0,ty=0;
addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});
function tick(){
  if(!running)return;
  cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
  scene.style.transform='rotateX('+(-cy*14)+'deg) rotateY('+(cx*18)+'deg)';
  burst*=.96;g.clearRect(0,0,W,H);
  for(const p of P){
    p.y-=p.s*p.z;if(p.y<-.02){p.y=1.02;p.x=Math.random()}
    let x=p.x,y=p.y;
    if(burst>.01){x+=Math.cos(p.a)*burst*.35*p.z;y+=Math.sin(p.a)*burst*.35*p.z}
    g.beginPath();g.fillStyle='rgba('+p.c+','+(.25+p.z*.5)+')';g.shadowBlur=12;g.shadowColor='rgb('+p.c+')';
    g.arc((x+cx*.03*p.z)*W,y*H,p.z*2.6*D,0,7);g.fill()}
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);

/* ===== Timeline ===== */
const splash=document.getElementById('splash');
const at=(ms,fn)=>setTimeout(fn,ms);
at(1300,()=>logo.classList.add('fill'));
at(1700,()=>{logo.classList.add('exp');document.getElementById('halo').classList.add('on');
  document.getElementById('s1').classList.add('go');document.getElementById('s2').classList.add('go');burst=1;
  logo.style.animation='spin 1.9s cubic-bezier(.5,0,.2,1) forwards'});
at(2500,()=>logo.classList.add('sw'));
at(SPLASH_MS,()=>{splash.classList.add('out');at(900,done)});
function done(){
  running=false;splash.remove();
  window.dispatchEvent(new Event('welcome:done'));
  if(window.AndroidWelcome && AndroidWelcome.onDone) AndroidWelcome.onDone();
  if(REDIRECT_URL)location.replace(REDIRECT_URL);
}
</script>
</body>
</html>
